[settings]
minimum_release_age = "7d"
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64"]

[tools]
node = "24.22.3"

# The build itself runs in Docker (BuildKit with buildx): the vm-* stages of ../Dockerfile,
# wired up by ../docker-bake.hcl. The node tools here are for verify and the test page.

[tasks.setup]
description = "Install npm v86 (for verify and test.html)"
run = "npm ci --silent"

[tasks.build]
description = "Build the VM Image and Snapshot in Docker, verify them there, and write them to out/"
dir = "{{config_root}}/.."
run = """
set -eu
mkdir -p vm/out
find vm/out -mindepth 1 -delete
docker buildx bake -f docker-bake.hcl vm-out
"""

[tasks.verify]
description = "Restore out/'s Snapshot in node and check the launcher, robots and every Command"
depends = ["setup"]
run = "node scripts/verify.mjs"

[tasks.serve]
description = "Serve out/ and the test page on port 8087"
run = "python3 -m http.server --bind 127.0.0.1 -d . 8087"
