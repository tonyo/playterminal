{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="description"
          content="PlayTerminal: play terminal-based games right in your browser.">
    <meta name="keywords" content="PlayTerminal,Games,Terminal,ASCII,v86">
    <meta name="author" content="Anton Ovchinnikov">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="{% static "games/css/base-styles.css" %}">
    {% block head %}{% endblock %}
    <title>PlayTerminal</title>
  </head>
  <body>
    <div id="page-content">
      <div class="column-side">
        <a href="{% url 'game_list' %}">
          <img src="{% static "games/img/play_logo.png" %}"
               width="250"
               alt="PlayTerminal logo">
        </a>
        <br />
        <br />
        <div id="sidebar">
          <div>
            <a href="{% url 'main' %}">Page zero</a>
          </div>
          <div>
            <a href="{% url 'game_list' %}">Games</a>
          </div>
          <div>
            <a href="{% url 'about' %}">About</a>
          </div>
          <div>
            <a href="{% url 'licenses' %}">Licenses</a>
          </div>
        </div>
      </div>
      <div class="column-main">
        {% block content %}{% endblock %}
      </div>
    </div>
  </body>
</html>
