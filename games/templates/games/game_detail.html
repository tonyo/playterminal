{% extends "games/base.html" %}
{% load static %}
{% block head %}
  <link rel="stylesheet"
        href="{% static "games/vendor/xterm-6.0.0/xterm.css" %}">
  <link rel="stylesheet" href="{% static "games/css/terminal-styles.css" %}">
  <script src="{% static "games/vendor/xterm-6.0.0/xterm.js" %}" defer></script>
  <script src="{% static "games/vendor/xterm-addon-webgl-0.19.0/addon-webgl.js" %}"
          defer></script>
  <script src="{% static "games/js/terminal-window.js" %}" defer></script>
  <script src="{% static "games/js/playterminal.js" %}" defer></script>
{% endblock %}
{% block content %}
  <h1>{{ game.name }}</h1>
  <br />
  <div class="game-info">{{ game.description_html }}</div>
  <br />
  <button id="open-terminal-btn" type="button" class="button">Play</button>
  <br />
  <br />
  <div id="status-message" class="alert alert-danger" role="alert" hidden></div>
  {{ game_config|json_script:"game-config" }}
  <script>
    var gameConfig = JSON.parse(
      document.getElementById('game-config').textContent);
  </script>
{% endblock %}
