{% extends 'games/base.html' %}

{% block content %}

  <h1>{{ object.name }}</h1>

  <br />
  <div style="white-space: pre-wrap;">{{ object.info }}</div>

  <br />
  <button id="open-terminal-btn" class="btn btn-info">Play</button>

  <br /><br />
  <div id="status-message" class="alert alert-danger" role="alert" hidden>
  </div>

  {{ game_config|json_script:"game-config" }}
  <script>
    var gameConfig = JSON.parse(
      document.getElementById('game-config').textContent);
    var gameId = gameConfig.id;
    var gameRefreshCode = gameConfig.refreshCode;
  </script>
{% endblock %}
