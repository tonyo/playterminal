# The Games, in the order the games page lists them. Each Game runs its Command in
# the VM Image (vm/image/Dockerfile installs the programs), and vm/scripts/verify.mjs
# checks that every Command is there. A Game's description is games/descriptions/<slug>.txt.
#
#   slug          the page URL (/game/<slug>/) and the description's file name
#   name          the title on the games page and the Game's page
#   command       the shell command that starts the Game in the VM Image
#   displayed     listed on the games page (optional, default false)
#   refresh_code  a key code sent after each launch to redraw (optional)

[[game]]
slug = "robots"
name = "Robots"
command = "robots"
displayed = true

[[game]]
slug = "nethack"
name = "NetHack"
command = "nethack"
displayed = true

[[game]]
slug = "tetris"
name = "Tetris"
command = "tetris"
displayed = true

[[game]]
slug = "greed"
name = "Greed"
command = "greed"
displayed = true

[[game]]
slug = "hangman"
name = "Hangman"
command = "hangman -d /usr/share/dict/american-english"
displayed = true
