# Installed by `mise run setup`; run on every file with `mise run lint`.
# Upstream hooks are pinned by commit SHA, with the tag in a comment.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: ef6cf06c079dd6b299dfc720b0f14400c9d168e1 # v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      # Vendored files stay byte-for-byte as upstream ships them.
      - id: trailing-whitespace
        exclude: &vendored ^games/static/games/(vendor/|.*\.min\.(js|css)$)
      - id: end-of-file-fixer
        exclude: *vendored
