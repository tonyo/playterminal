# Installed by `mise run setup`; run on every file with `mise run lint`.
# Upstream hooks are pinned by commit SHA, with the tag in a comment.
repos:
  # vm/scripts/third-party.py (config in ruff.toml).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: ef6cf06c079dd6b299dfc720b0f14400c9d168e1 # v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: trailing-whitespace
        # Patches keep the space that marks a blank context line.
        exclude: \.patch$
      - id: end-of-file-fixer

  # JS and CSS: lint, then format (config in biome.jsonc). Runs on the node from mise.toml.
  - repo: https://github.com/biomejs/pre-commit
    rev: 19865851e014cbe6138e295365f95ca51bf953f8 # v0.6.1
    hooks:
      - id: biome-check
        additional_dependencies: ["@biomejs/biome@2.6.8"]
        language_version: system

  # vm/test.html: format, then lint (config in djlint.toml).
  - repo: https://github.com/djlint/djLint
    rev: 9cf2467f5e6af251156f9b08a7a78ed11a89cc1d # v1.50.0
    hooks:
      - id: djlint-reformat
      - id: djlint
