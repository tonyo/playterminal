# Local run: `mise run up` (mise sets COMPOSE_FILE=docker-compose.yaml:compose.local.yaml)
# Builds the images instead of pulling them, publishes nginx on :8090, and
# mounts the VM Image and Snapshot built in vm/ (`mise run build` there).
# V86_OUT overrides where that output lives.
services:
  playterminal-nginx:
    pull_policy: build
    image: playterminal-nginx:v86-local
    ports:
      - "${PLAYTERMINAL_PORT:-8090}:80"
    volumes:
      - ${V86_OUT:-./vm/out}:/app/v86:ro
  playterminal-server:
    pull_policy: build
    image: playterminal-server:v86-local
