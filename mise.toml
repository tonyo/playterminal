[settings]
minimum_release_age = "7d"
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64"]

[tools]
# Builds and tests the site (site/), runs the VM checks (vm/) and the Biome hook.
node = "24.22.3"
# Runs the git hooks in .pre-commit-config.yaml.
pre-commit = "4.7.0"
# pre-commit ships as a .pyz and installs its Python hooks (ruff, the file checks) into
# virtualenvs.
python = "3.14.10"

[env]
# The static site (site/) is built with Astro; don't send Astro usage telemetry.
ASTRO_TELEMETRY_DISABLED = "1"

[tasks.setup]
description = "Install the locked npm dependencies and the git pre-commit hooks"
depends = ["site:install", "vm:install"]
run = "pre-commit install"

[tasks.lint]
description = "Run the pre-commit hooks (Biome, ruff, YAML/JSON/TOML checks, whitespace) on every file"
run = "pre-commit run --all-files"

[tasks.test]
description = "Build the static site and run its tests"
depends = ["site:test"]

# The whole image.

[tasks.image]
description = "Build the whole image, tonyo/playterminal: VM Image, Snapshot (verified), site, nginx"
run = "docker buildx bake -f docker-bake.hcl"

[tasks.up]
description = "Build the image and serve it on http://localhost:8090"
depends = ["image"]
run = """
set -eu
docker rm -f playterminal-local >/dev/null 2>&1 || true
docker run -d --name playterminal-local -p 127.0.0.1:${PLAYTERMINAL_PORT:-8090}:80 tonyo/playterminal
"""

[tasks.smoke]
description = "Check the running container (mise run up) over HTTP"
run = "scripts/smoke-test.sh http://localhost:${PLAYTERMINAL_PORT:-8090}"

[tasks.down]
description = "Stop the local container"
run = "docker rm -f playterminal-local"

# The static site (site/).

[tasks."site:install"]
description = "Install the static site's locked npm dependencies"
dir = "site"
run = "npm ci --no-fund --no-audit"

[tasks."site:dev"]
description = "Serve the static site with live reload on http://localhost:4321 (VM files from vm/out)"
depends = ["site:install"]
dir = "site"
run = "npx astro dev"

[tasks."site:build"]
description = "Build the static site into site/dist"
depends = ["site:install"]
dir = "site"
run = "npx astro build"

[tasks."site:test"]
description = "Build the static site, then test it"
depends = ["site:build"]
dir = "site"
run = "node --test"

# The VM Image and Snapshot (vm/). The build runs in Docker: the vm-* stages of Dockerfile.

[tasks."vm:install"]
description = "Install vm/'s locked npm dependencies (v86, for vm:verify)"
dir = "vm"
run = "npm ci --no-fund --no-audit"

[tasks."vm:build"]
description = "Build the VM Image and Snapshot in Docker, verify them there, and write them to vm/out"
run = """
set -eu
mkdir -p vm/out
find vm/out -mindepth 1 -delete
docker buildx bake -f docker-bake.hcl vm-out
"""

[tasks."vm:verify"]
description = "Restore vm/out's Snapshot in node and check the launcher, robots and every Command"
depends = ["vm:install"]
dir = "vm"
run = "node scripts/verify.mjs"
