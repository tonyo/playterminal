[settings]
minimum_release_age = "7d"
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64"]

# mise installs Python and uv; uv manages .venv from pyproject.toml and uv.lock.
[tools]
python = "3.14.10"
uv = "0.13"
# Runs the git hooks in .pre-commit-config.yaml.
pre-commit = "4.7.0"
# For the Biome hook (JS and CSS); same version as vm/.
node = "24.22.3"

[env]
_.python.venv = { path = ".venv", create = true }
COMPOSE_FILE = "docker-compose.yaml:compose.local.yaml"

[tasks.setup]
description = "Install the locked dependencies and the git pre-commit hooks"
depends = ["sync"]
run = "pre-commit install"

[tasks.lint]
description = "Run the pre-commit hooks (ruff, Biome, djLint, YAML/JSON/TOML checks, whitespace) on every file"
run = "pre-commit run --all-files"

[tasks.format]
description = "Format and fix the Python code with ruff"
depends = ["sync"]
run = ["ruff check --fix .", "ruff format ."]

[tasks.sync]
description = "Install the locked dependencies into .venv"
run = "uv sync --locked"

[tasks.test]
description = "Run the tests"
depends = ["sync"]
env = { SECRET_KEY = "test" }
run = "pytest tests/ -p no:cacheprovider"

[tasks.up]
description = "Build and start the local stack on http://localhost:8090, then migrate and collect static files"
run = """
set -eu
docker compose up -d --build
docker compose exec -T playterminal-server sh -c \
  "python manage.py migrate --noinput && python manage.py collectstatic --noinput --clear"
"""

[tasks.down]
description = "Stop the local stack"
run = "docker compose down"

[tasks.clean]
description = "Delete compiled Python files"
run = "find . -path ./.venv -prune -o \\( -name '*.pyc' -o -name '*.pyo' \\) -print -delete"
