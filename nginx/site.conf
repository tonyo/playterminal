# PlayTerminal is all files: the Astro build (HTML, /_astro/) and, under /v86/, the VM Image
# and Snapshot. TLS ends at the proxy in front.
server {
  listen 80;
  server_name playtermin.al;
  root /srv/playterminal;
  charset utf-8;

  # Behind the TLS proxy: keep redirects (/about -> /about/) relative.
  absolute_redirect off;

  # Serve the .gz files the image build made next to the originals. The proxy in front may
  # add Via or speak HTTP/1.0; serve them gzipped anyway.
  gzip_static on;
  gzip_vary on;
  gzip_proxied any;
  gzip_http_version 1.0;

  error_page 404 /404.html;

  # Pages and license files: revalidate on every load (a 304 when unchanged).
  expires -1;

  # Astro's CSS, JS, fonts and images are named by content hash, so they never change.
  location /_astro/ {
      expires max;
  }

  # config.mjs and THIRD-PARTY.txt keep their names across VM builds: revalidate.
  # config.mjs names the current emulator, BIOS files, fs.json and Snapshot, so a browser
  # never boots an old one.
  location /v86/ {
      types {
          application/javascript js mjs;
          application/wasm wasm;
          application/json json;
          text/plain txt;
      }
      default_type application/octet-stream;
  }

  # Named by content hash (vm/scripts/stamp.mjs), so they never change.
  location ~ ^/v86/(libv86|v86|seabios|vgabios|fs|state)-[0-9a-f]+\.(js|wasm|bin|json|bin\.zst)$ {
      types {
          application/javascript js;
          application/wasm wasm;
          application/json json;
      }
      default_type application/octet-stream;
      expires max;
  }

  # The VM Image's files are named by their sha256, so they never change.
  location /v86/rootfs-flat/ {
      default_type application/octet-stream;
      expires max;
  }

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
}
