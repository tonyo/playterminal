# PlayTerminal is all files: the Astro build (HTML, /_astro/) and, under /v86/, the VM Image
# and Snapshot. TLS ends at the proxy in front.
server {
  listen 80;
  server_name playtermin.al;
  root /srv/playterminal;
  charset utf-8;

  # nginx's mime.types plus config.mjs's type, which it lacks.
  include /etc/nginx/mime.types;
  types {
      application/javascript mjs;
  }

  # Behind the TLS proxy: keep redirects (/about -> /about/) relative.
  absolute_redirect off;

  # Serve the .gz files the image build made next to the originals. The proxy in front may
  # add Via or speak HTTP/1.0; serve them gzipped anyway.
  gzip_static on;
  gzip_vary on;
  gzip_proxied any;
  gzip_http_version 1.0;

  error_page 404 /404.html;

  # Pages and license files: revalidate on every load (a 304 when unchanged).
  expires -1;

  # Astro's CSS, JS, fonts and images are named by content hash, so they never change.
  location /_astro/ {
      expires max;
  }

  # The VM files: emulator, BIOS files, fs.json, Snapshot (vm/scripts/stamp.mjs) and
  # rootfs-flat/ (sha256) are named by content hash, so they never change...
  location /v86/ {
      expires max;
  }

  # ...except these two, which keep their names across VM builds. config.mjs names the
  # current files, so revalidating it means a browser never boots an old VM.
  location = /v86/config.mjs {
      expires -1;
  }

  location = /v86/THIRD-PARTY.txt {
      expires -1;
  }

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
}
