name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - name: Lint (all pre-commit hooks on every file)
        run: mise run lint

  # The static site (site/): Astro build, then node:test on the code and on dist/.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - name: Build and test the site
        run: mise run site:test

  # The whole image (docker-bake.hcl): VM Image, Snapshot and its verify, site build and
  # tests, nginx. Not pushed. The VM stages come from the gha cache unless vm/ changed.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-bake.hcl
          load: true
          # One cache scope per target, or they overwrite each other's.
          set: |
            guest.cache-from=type=gha,scope=guest
            guest.cache-to=type=gha,scope=guest,mode=max
            playterminal.cache-from=type=gha,scope=playterminal
            playterminal.cache-to=type=gha,scope=playterminal,mode=max
      - name: Smoke test the container
        run: |
          docker run -d --name playterminal -p 8090:80 tonyo/playterminal
          scripts/smoke-test.sh http://localhost:8090
